name: Portable builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Build with spaces and shell characters in the path
        shell: pwsh
        run: |
          $platform = if ($IsWindows) { 'win32' } else { 'linux' }
          $output = Join-Path $env:RUNNER_TEMP "portable build & test!/privaproxy-$platform-x64"
          node scripts/build-portable.js --output "$output" --ytdlp-version 2026.08.19
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }
          "PORTABLE_OUTPUT=$output" >> $env:GITHUB_ENV
      - name: Verify the launcher without host runtimes on PATH
        shell: pwsh
        run: |
          $launcher = Join-Path $env:PORTABLE_OUTPUT ($IsWindows ? 'privaproxy.cmd' : 'privaproxy')
          node scripts/smoke-cli.js "$launcher" --without-host-runtimes
          if ($LASTEXITCODE -ne 0) { throw 'Portable launcher checks failed' }
      - name: Verify browser workers and UI in headless Firefox
        run: node scripts/run-firefox-smoke.js
      - name: Build updater-compatible server release
        if: runner.os == 'Linux'
        run: npm run build:server-release
      - name: Verify updater-compatible server release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          ARCHIVE="dist/server/privaproxy-${VERSION}.tar.gz"
          test -f "$ARCHIVE"
          test -f dist/server/SHA256SUMS.txt
          grep -F "privaproxy-${VERSION}.tar.gz" dist/server/SHA256SUMS.txt
          tar -tzf "$ARCHIVE" | grep -F "privaproxy-${VERSION}/bin/privaproxy.js"
          tar -tzf "$ARCHIVE" | grep -F "privaproxy-${VERSION}/package-lock.json"
          tar -tzf "$ARCHIVE" | grep -F "privaproxy-${VERSION}/deploy/systemd/privaproxy.service"
      - name: Upload verified server release
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: privaproxy-server-release
          path: |
            dist/server/privaproxy-*.tar.gz
            dist/server/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Package and verify extracted Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -LiteralPath $env:PORTABLE_OUTPUT -DestinationPath dist/privaproxy-windows-x64.zip
          $extracted = Join-Path $env:RUNNER_TEMP 'extracted portable zip'
          Expand-Archive -LiteralPath dist/privaproxy-windows-x64.zip -DestinationPath $extracted
          node scripts/smoke-cli.js "$extracted/privaproxy-win32-x64/privaproxy.cmd" --without-host-runtimes
          if ($LASTEXITCODE -ne 0) { throw 'Extracted ZIP checks failed' }
          $hash = (Get-FileHash dist/privaproxy-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  privaproxy-windows-x64.zip" | Set-Content -Encoding ascii dist/privaproxy-windows-x64.zip.sha256
      - name: Upload verified Windows download
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: privaproxy-windows-x64
          path: |
            dist/privaproxy-windows-x64.zip
            dist/privaproxy-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
